<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarefas Baixadas</title>
  <link rel="stylesheet" href="static/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="header-brand">
      <div class="header-logo-wrap">
        <img src="data/imagens/logo.png" alt="MG Contabilidade" class="header-logo" />
      </div>
      <div class="header-text">
        <h1 class="header-titulo">Tarefas Baixadas</h1>
        <p class="header-subtitulo">Acompanhamento de baixas por unidade, departamento e coordenador</p>
        <p class="header-atualizacao" id="header-atualizacao"></p>
      </div>
    </div>
  </header>

  <main class="content">

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Carregando dados...</span>
    </div>

    <div id="dashboard" style="display:none;">

      <!-- Filtros -->
      <section class="filtros-card">
        <div class="filtros-header">
          <div class="filtros-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
            Filtros
          </div>
          <button type="button" id="btn-limpar-filtros" class="btn-limpar-filtros">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
              <path d="M19 6l-.8 13.6a2 2 0 0 1-2 1.9H7.8a2 2 0 0 1-2-1.9L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
            Limpar filtros
          </button>
        </div>
        <div class="filtros-grid">
          <div class="filtro-grupo">
            <label class="filtro-label" for="sel-unidade">Unidade</label>
            <select id="sel-unidade" class="filtro-select"></select>
          </div>
          <div class="filtro-grupo">
            <label class="filtro-label" for="sel-depto">Departamento</label>
            <select id="sel-depto" class="filtro-select"></select>
          </div>
          <div class="filtro-grupo">
            <label class="filtro-label" for="sel-coordenador">Coordenador</label>
            <select id="sel-coordenador" class="filtro-select"></select>
          </div>
          <div class="filtro-grupo">
            <label class="filtro-label" for="sel-tarefa">Tarefa</label>
            <select id="sel-tarefa" class="filtro-select"></select>
          </div>
          <div class="filtro-grupo">
            <label class="filtro-label" for="sel-semana">Semana</label>
            <select id="sel-semana" class="filtro-select"></select>
          </div>
        </div>
      </section>

      <!-- Cards -->
      <section class="cards-section">
        <div class="card card-total">
          <div class="card-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/>
              <line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="card-label">Total de Tarefas</span>
            <span class="card-value" id="card-total">0</span>
          </div>
        </div>

        <div class="card card-prazo">
          <div class="card-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/><polyline points="8.5 12.5 11 15 15.5 9"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="card-label">Baixadas no Prazo</span>
            <span class="card-value" id="card-prazo">0</span>
            <span class="card-pct" id="pct-prazo"></span>
          </div>
        </div>

        <div class="card card-atraso">
          <div class="card-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 9v4"/><path d="M10.3 3.9 2.3 18a1.8 1.8 0 0 0 1.6 2.7h16.2a1.8 1.8 0 0 0 1.6-2.7l-8-14.1a1.8 1.8 0 0 0-3.2 0z"/>
              <circle cx="12" cy="16.3" r=".6" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="card-label">Baixadas em Atraso</span>
            <span class="card-value" id="card-atraso">0</span>
            <span class="card-pct" id="pct-atraso"></span>
          </div>
        </div>

        <div class="card card-antecipada">
          <div class="card-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 3 4 14 11 14 10 21 20 9 13 9 13 3"/>
            </svg>
          </div>
          <div class="card-body">
            <span class="card-label">Baixa Antecipada</span>
            <span class="card-value" id="card-antecipada">0</span>
            <span class="card-pct" id="pct-antecipada"></span>
          </div>
        </div>
      </section>

      <!-- Gráficos -->
      <section class="graficos-section">
        <div class="grafico-box">
          <h2 class="grafico-titulo">Classificação das Tarefas</h2>
          <div class="grafico-canvas-wrap">
            <canvas id="grafico-barras"></canvas>
          </div>
        </div>
        <div class="grafico-box">
          <h2 class="grafico-titulo">Prazo vs Atraso</h2>
          <div class="grafico-canvas-wrap">
            <canvas id="grafico-rosca"></canvas>
          </div>
        </div>
      </section>

      <!-- Ranking -->
      <section class="ranking-box">
        <div class="ranking-header">
          <h2 class="grafico-titulo ranking-titulo">Ranking</h2>
          <div class="toggle-grupo">
            <button id="btn-tarefas" class="toggle-btn active" onclick="alternarRanking('tarefas')">Tarefas</button>
            <button id="btn-colaboradores" class="toggle-btn" onclick="alternarRanking('colaboradores')">Colaboradores</button>
          </div>
        </div>
        <div id="ranking-lista" class="ranking-lista"></div>
      </section>

    </div>
  </main>

  <script src="static/app.js"></script>
</body>
</html>
